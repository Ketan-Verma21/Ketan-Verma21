# Draws a snake that eats your contribution graph; refreshed daily.
# Output goes to the `output` branch, which README.md links to.
name: Snake

on:
  schedule:
    - cron: "17 3 * * *" # daily, 08:47 IST
  workflow_dispatch: # "Run workflow" button for the first run
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
