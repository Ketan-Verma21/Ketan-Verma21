<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Dev runner: a developer jumps over bugs, null and merge conflicts on an endless track">
<title>Dev Runner</title>
<style>
.bg{fill:#0d1117} .t{font-family:'Fira Code',Consolas,monospace}
.title{fill:#e6edf3;font-size:16px;font-weight:700;letter-spacing:3px}
.hud{fill:#7d8590;font-size:14px} .ground{stroke:#30363d;stroke-width:2}
.dash{stroke:#30363d;stroke-width:2;stroke-dasharray:6 18;animation:scroll .6s linear infinite}
@keyframes scroll{to{stroke-dashoffset:-24}}
.cloud{fill:#161b22}
.c1{animation:drift 14s linear infinite} .c2{animation:drift 20s linear infinite;animation-delay:-8s}
@keyframes drift{from{transform:translateX(880px)} to{transform:translateX(-200px)}}
.runner{animation:jump 2.2s infinite}
@keyframes jump{
  0%,67.2%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
  79.2%{transform:translateY(-78px);animation-timing-function:cubic-bezier(.6,0,.8,.3)}
  91.2%,100%{transform:translateY(0)}
}
.legs{animation:run .25s steps(2) infinite}
@keyframes run{50%{transform:scaleX(-1)}}
.obs{font-weight:700}
@keyframes o0{0%{transform:translateX(0)} 33.3333%{transform:translateX(-960px)} 100%{transform:translateX(-960px)}}
.o0{animation:o0 6.6000000000000005s linear infinite;animation-delay:-6.60s}
@keyframes o1{0%{transform:translateX(0)} 33.3333%{transform:translateX(-960px)} 100%{transform:translateX(-960px)}}
.o1{animation:o1 6.6000000000000005s linear infinite;animation-delay:-4.40s}
@keyframes o2{0%{transform:translateX(0)} 33.3333%{transform:translateX(-960px)} 100%{transform:translateX(-960px)}}
.o2{animation:o2 6.6000000000000005s linear infinite;animation-delay:-2.20s}
</style>
<rect class="bg" width="880" height="240" rx="16"/>
<text class="t title" x="28" y="36">DEV RUNNER</text>
<text class="t hud" x="852" y="36" text-anchor="end">HI 001511 · bugs dodged: ∞</text>
<g class="c1"><ellipse class="cloud" cx="0" cy="70" rx="46" ry="12"/><ellipse class="cloud" cx="24" cy="62" rx="26" ry="10"/></g>
<g class="c2"><ellipse class="cloud" cx="0" cy="100" rx="36" ry="10"/></g>
<line class="ground" x1="20" y1="180" x2="860" y2="180"/>
<line class="dash" x1="20" y1="194" x2="860" y2="194"/>
<g class="o0"><text x="900" y="174" font-size="30">🐛</text><text class="t" x="900" y="214" font-size="11" fill="#7d8590">bug</text></g>
<g class="o1"><rect x="900" y="150" width="58" height="28" rx="6" fill="none" stroke="#f85149" stroke-width="2"/><text class="t obs" x="929.0" y="169" text-anchor="middle" font-size="15" fill="#f85149">null</text><text class="t" x="900" y="214" font-size="11" fill="#7d8590">null</text></g>
<g class="o2"><rect x="900" y="150" width="88" height="28" rx="6" fill="none" stroke="#d29922" stroke-width="2"/><text class="t obs" x="944.0" y="169" text-anchor="middle" font-size="15" fill="#d29922">&lt;&lt;&lt;&lt;&lt;&lt;&lt;</text><text class="t" x="900" y="214" font-size="11" fill="#7d8590">merge conflict</text></g>
<g class="runner">
  <g transform="translate(130 180)">
    <circle cx="0" cy="-52" r="11" fill="#54c5f8"/>
    <rect x="-4" y="-55" width="3" height="3" fill="#0d1117"/><rect x="4" y="-55" width="3" height="3" fill="#0d1117"/>
    <rect x="-10" y="-41" width="20" height="24" rx="6" fill="#02569b"/>
    <rect x="6" y="-38" width="16" height="11" rx="2" fill="#7ee787"/>
    <text class="t" x="14" y="-29" font-size="8" text-anchor="middle" fill="#0d1117">&lt;/&gt;</text>
    <g class="legs" style="transform-box:fill-box;transform-origin:center">
      <path d="M-5 -17 L-9 0 M5 -17 L9 0" stroke="#54c5f8" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</g>
</svg>